<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lissan@matrix</title>
<style>
  :root{--green:#00ff66;--dim:#0a6e33;--bright:#c6ffdb;--amber:#ffcf4d;
    --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#000;color:var(--green);font-family:var(--mono);overflow:hidden}
  #rain{position:fixed;inset:0;z-index:0;opacity:.55}
  .veil{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.86) 80%)}
  #stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:min(760px,94vw);max-height:90vh;overflow:auto;
    border:1px solid var(--dim);background:rgba(0,10,4,.72);backdrop-filter:blur(2px);
    box-shadow:0 0 40px rgba(0,255,102,.15),inset 0 0 60px rgba(0,255,102,.04);
    padding:26px 30px;text-shadow:0 0 8px rgba(0,255,102,.5)}
  .box::-webkit-scrollbar{width:8px}.box::-webkit-scrollbar-thumb{background:var(--dim)}
  h1{font-size:14px;font-weight:400;color:var(--dim);letter-spacing:.3em;margin-bottom:18px}
  pre{white-space:pre-wrap;font:inherit;margin:0}
  .b{color:var(--bright)} .a{color:var(--amber)} .d{color:var(--dim)}
  .line{margin:2px 0}
  .prompt{display:flex;gap:8px;margin-top:14px;align-items:baseline}
  .prompt .lbl{color:var(--bright)}
  #pass{background:transparent;border:none;color:var(--bright);font:inherit;outline:none;flex:1;
    text-shadow:0 0 8px rgba(0,255,102,.6);caret-color:var(--green)}
  .cursor{display:inline-block;width:10px;height:1.05em;background:var(--green);vertical-align:text-bottom;
    animation:bl 1s steps(1) infinite;box-shadow:0 0 8px var(--green)}
  @keyframes bl{50%{opacity:0}}
  .proj{border-left:2px solid var(--dim);padding:2px 0 10px 14px;margin:14px 0;opacity:0;transform:translateX(-6px)}
  .proj.in{opacity:1;transform:none;transition:opacity .4s,transform .4s}
  .proj .t{color:var(--bright);font-size:16px}
  .proj .yr{color:var(--dim)}
  .proj .pull{color:var(--amber);font-size:13px;margin:2px 0}
  .proj .desc{color:var(--green);font-size:13.5px;opacity:.92}
  .proj .tags{color:var(--dim);font-size:12px;margin-top:6px}
  .proj a{color:var(--bright);text-decoration:none;border-bottom:1px solid var(--dim)}
  .proj a:hover{border-color:var(--bright)}
  .hintbar{margin-top:18px;color:var(--dim);font-size:12px;border-top:1px solid var(--dim);padding-top:10px}
  @media(prefers-reduced-motion:reduce){.cursor{animation:none}#rain{opacity:.3}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="veil"></div>
<div id="stage">
  <div class="box" id="box">
    <h1>W A K E &nbsp; U P ,&nbsp; N E O . . .</h1>
    <pre id="term"></pre>
    <div class="prompt" id="promptline" style="display:none">
      <span class="lbl">lissan login:</span>
      <input id="pass" autocomplete="off" spellcheck="false" aria-label="password" value="guest">
      <span class="cursor"></span>
    </div>
    <div id="reveal"></div>
  </div>
</div>

<script>
const P=[
 {t:'WorldEval / WorldArena',yr:'2026',pull:'Evaluate what a model does, not only what it says.',desc:'LLM agents in deterministic 3D worlds — sealed plans, real consequences, an authoritative Godot sim.',tags:['Python','Godot 4.5','FastAPI'],url:'https://github.com/LissanKoirala/WorldEval'},
 {t:'Quantum Junction',yr:'2026',pull:'Choose the right simulator before spending the compute.',desc:'Reads each obfuscated peaked quantum circuit and routes it to the cheapest attack. 41/49 solved.',tags:['Qiskit','Tensor networks','Quimb'],url:'https://github.com/LissanKoirala/quantum-junction'},
 {t:'Advisory Workbench',yr:'2026',pull:'The agent proposes, the human decides — every claim cited.',desc:'SwissHacks 2026 build for SIX — provenance-first wealth advisory. Nothing auto-executes.',tags:['Next.js','FastAPI','Fintech'],url:'https://github.com/LissanKoirala/SwissHacks-Six'},
 {t:'Aurora Visibility',yr:'2025',pull:'Where can you really see the northern lights tonight?',desc:'CASSINI Hackathon: OVATION oval model fused with Sentinel cloud & light-pollution data.',tags:['Sentinel','OVATION','GIS'],url:'https://github.com/LissanKoirala/cassini-hackathon'},
 {t:'Algo',yr:'2026',pull:'Signals in, positions out.',desc:'A live algorithmic trading system with a positions dashboard.',tags:['Python','Quant'],url:'https://algo.lissan.dev/positions-dashboard'},
 {t:'Underground Live Map',yr:'2025',pull:'Watch London move.',desc:'A live map of the London Underground and buses, in real time.',tags:['JavaScript'],url:'https://github.com/LissanKoirala/underground-live-map'},
 {t:"God's Eye",yr:'2024',pull:'Every camera, one eye.',desc:'Multi-camera surveillance & person tracking, inspired by Fast & Furious.',tags:['OpenCV'],url:'https://godseye.lissan.dev'},
 {t:'Solar System Simulation',yr:'2023',pull:"Newton's laws, one time-step at a time.",desc:'N-body simulation studying Comet Halley\'s orbit, with papers.',tags:['Python','N-body'],url:'https://github.com/LissanKoirala/Solar-System-Simulation'},
 {t:'Robot Vision',yr:'2022',pull:'Sight, then motion.',desc:'A 3D-printed robot controlled programmatically through a CV pipeline.',tags:['Python','OpenCV'],url:'https://github.com/LissanKoirala/Robot-Vision'}
];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* rain */
const cv=document.getElementById('rain'),ctx=cv.getContext('2d');
const GL='アイウエオカキクケコサシスセソタチツテトナニヌ0123456789LISSANKOIRALA<>[]{}=+*';
let cols,drops,W,H,FS=16;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;cols=Math.floor(W/FS);drops=Array(cols).fill(0).map(()=>Math.random()*-40);}
rs();addEventListener('resize',rs);
function rain(){
  ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,0,W,H);
  ctx.font=FS+'px monospace';
  for(let i=0;i<cols;i++){
    const ch=GL[Math.floor(Math.random()*GL.length)];
    const x=i*FS,y=drops[i]*FS;
    ctx.fillStyle=Math.random()>.975?'#c6ffdb':'#00ff66';
    ctx.fillText(ch,x,y);
    if(y>H&&Math.random()>.975)drops[i]=0; drops[i]+=0.5;
  }
  if(!reduce)requestAnimationFrame(rain);
}
if(!reduce)rain(); else {ctx.fillStyle='#00ff66';ctx.font=FS+'px monospace';for(let i=0;i<cols;i++)for(let j=0;j<3;j++)ctx.fillText(GL[Math.floor(Math.random()*GL.length)],i*FS,(j*7+Math.random()*30)*FS%H);}

/* boot type */
const term=document.getElementById('term');
const boot=[
 {t:'> establishing uplink to lissan.dev ............ ',c:''},
 {t:'[OK]',c:'a',same:true},
 {t:'> trace route :: 9 nodes reachable',c:'d'},
 {t:'> handshake :: agents · quantum · quant · vision',c:'d'},
 {t:'> this is your last chance. after this, there is no turning back.',c:'b'},
 {t:'> type a passphrase (or just hit Enter) to decrypt the portfolio.',c:''},
];
let bi=0,btxt='';
function bootType(){
  if(reduce){ btxt=boot.map(l=>span(l)).join('\n'); term.innerHTML=btxt; showPrompt(); return; }
  if(bi>=boot.length){ term.innerHTML=btxt; showPrompt(); return; }
  const l=boot[bi];
  btxt+= (l.same? span(l) : (bi?'\n':'')+span(l));
  term.innerHTML=btxt+'<span class="cursor"></span>';
  bi++; setTimeout(bootType,320);
}
function span(l){return l.c?`<span class="${l.c}">${l.t}</span>`:l.t;}
function showPrompt(){document.getElementById('promptline').style.display='flex';document.getElementById('pass').focus();}

const passEl=document.getElementById('pass');
let unlocked=false;
function unlock(){
  if(unlocked)return;unlocked=true;
  document.getElementById('promptline').innerHTML='<span class="lbl">lissan login:</span> <span class="a">ACCESS GRANTED</span>';
  const r=document.getElementById('reveal');
  r.innerHTML='<div class="line d" style="margin-top:14px">> decrypting 9 records ...</div>'+
    P.map((p,i)=>`<div class="proj" id="p${i}">
      <div><span class="t">${p.t}</span> <span class="yr">[${p.yr}]</span></div>
      <div class="pull">${p.pull}</div>
      <div class="desc">${p.desc}</div>
      <div class="tags">tags: ${p.tags.join(' · ')} — <a href="${p.url}" target="_blank" rel="noreferrer">open ↗</a></div>
    </div>`).join('')+
    `<div class="hintbar">wake@lissan.dev · <a href="https://github.com/LissanKoirala" target="_blank" rel="noreferrer" style="color:var(--dim)">github.com/LissanKoirala</a> · knock knock.</div>`;
  P.forEach((_,i)=>setTimeout(()=>{const el=document.getElementById('p'+i);if(el)el.classList.add('in');
    if(i===P.length-1)document.getElementById('box').scrollTo({top:0});}, reduce?0:220*i));
}
passEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();unlock();}});
bootType();
</script>
</body>
</html>
